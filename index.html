<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>발표 리허설 룸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand"><span class="mark" aria-hidden="true"><i></i></span><div><b>발표 리허설 룸</b><small id="projMeta">불러오는 중</small></div></div>
    <div class="me"><label for="meName">내 이름</label><input id="meName" type="text" placeholder="작성자 표시용" maxlength="20"></div>
    <div class="proj"><label for="projSel">사업</label><select id="projSel"><option value="">불러오는 중</option></select></div>
  </div>
  <nav class="tabs" aria-label="기능">
    <a href="#rehearsal" data-tab="rehearsal">셀프 리허설</a>
    <a href="#scripts" data-tab="scripts">스크립트</a>
    <a href="#qa" data-tab="qa">질의 목록</a>
    <a href="#practice" data-tab="practice">질의 연습</a>
    <a href="#setup" data-tab="setup" class="right">사업 자료 관리</a>
  </nav>
</header>
<div id="notice" class="notice hidden" role="status"></div>

<main>
<!-- 1. 셀프 리허설 -->
<section id="v-rehearsal" class="view">
  <div class="card rh-settings">
    <div class="field"><label for="rhMin">총 발표 시간</label>
      <div class="mmss"><input id="rhMin" type="number" min="0" max="180" value="20" aria-label="분"><span>분</span><input id="rhSec" type="number" min="0" max="59" value="0" aria-label="초"><span>초</span></div>
    </div>
    <div class="field"><label>빠른 설정</label><div class="chips" id="rhPresets"></div></div>
    <div class="field"><label for="rhAlloc">슬라이드별 목표 시간</label>
      <select id="rhAlloc"><option value="equal">균등 배분</option><option value="script">스크립트 분량에 비례</option><option value="none">배분 안 함 (전체 시간만)</option></select>
    </div>
    <div class="field"><label for="rhWarn">종료 전 경고</label>
      <select id="rhWarn"><option value="30">30초 전</option><option value="60" selected>1분 전</option><option value="120">2분 전</option><option value="180">3분 전</option></select>
    </div>
  </div>

  <div class="stage-wrap" id="stageWrap">
    <div class="stage">
      <div class="slide-box" id="slideBox"><canvas id="slideCanvas" class="hidden"></canvas><div id="slideDom" class="hidden"></div><div id="slideText" class="slide-text"></div></div>
      <div class="stage-nav"><button id="rhPrev" type="button">이전</button><span id="rhPos">1 / 1</span><button id="rhNext" type="button">다음</button></div>
    </div>
    <aside class="clock" id="clock" data-state="idle">
      <div class="clock-label"><span id="ckLabel">남은 시간</span><span id="ckTotal"></span></div>
      <div class="clock-main" id="ckMain">20:00</div>
      <div class="bar main"><span id="ckBar"></span></div>
      <div class="clock-sub">
        <div><small>경과</small><b id="ckElapsed">00:00</b></div>
        <div><small>이 슬라이드</small><b id="ckSlide">00:00</b><em id="ckSlideT"></em></div>
      </div>
      <div class="bar thin"><span id="ckSlideBar"></span></div>
      <div class="pace" id="ckPace">시작 전</div>
      <div class="ctrl"><button id="rhToggle" class="primary" type="button">시작</button><button id="rhReset" type="button">처음부터</button></div>
      <div class="ctrl"><button id="rhFinish" type="button">종료하고 결과 보기</button></div>
      <div class="ctrl"><button id="rhScriptBtn" type="button">스크립트 가리기</button><button id="rhFull" type="button">전체 화면</button></div>
      <div class="keys"><kbd>Space</kbd> 시작·일시정지 &nbsp;<kbd>←</kbd><kbd>→</kbd> 슬라이드<br><kbd>S</kbd> 스크립트 &nbsp;<kbd>F</kbd> 전체 화면 &nbsp;발표용 리모컨(PageUp/Down)도 됩니다</div>
    </aside>
    <div class="script-pane" id="scriptPane">
      <div class="sp-head"><b id="spTitle">스크립트</b><span><button id="spSmaller" type="button" aria-label="글자 작게">가−</button> <button id="spBigger" type="button" aria-label="글자 크게">가+</button></span></div>
      <div id="spText" class="sp-text"></div>
    </div>
  </div>
  <div id="rhResult"></div>
  <div id="rhHistory"></div>
</section>

<!-- 2. 스크립트 -->
<section id="v-scripts" class="view">
  <div class="view-head">
    <div><h2>발표 스크립트</h2><p id="scSummary"></p></div>
    <div class="tools"><input id="scSearch" type="search" placeholder="스크립트 내용 검색"><select id="scFilter" aria-label="표시 범위"><option value="all">전체 슬라이드</option><option value="empty">미작성만</option><option value="done">작성된 것만</option></select></div>
  </div>
  <div id="scList" class="sc-list"></div>
</section>

<!-- 3. 질의 목록 -->
<section id="v-qa" class="view">
  <div class="view-head">
    <div><h2>예상 질의 목록</h2><p id="qaSummary"></p></div>
    <div class="tools">
      <button id="qaAddBtn" class="primary" type="button">질의 추가</button>
      <button id="qaPasteBtn" type="button">엑셀에서 붙여넣기</button>
      <button id="qaAiBtn" type="button">AI 질의 생성용 프롬프트</button>
      <button id="qaCsvBtn" type="button">CSV 내려받기</button>
    </div>
  </div>
  <div id="qaPanel"></div>
  <div class="filters">
    <input id="qaSearch" type="search" placeholder="목록 안에서 찾기">
    <select id="qaCat" aria-label="구분"></select>
    <select id="qaSrc" aria-label="출처"><option value="">모든 출처</option><option value="manual">직접 입력</option><option value="import">엑셀 붙여넣기</option><option value="ai">AI 생성</option></select>
    <select id="qaSort" aria-label="정렬"><option value="page">페이지순</option><option value="cat">구분순</option><option value="new">최근 추가순</option></select>
    <label class="chk"><input type="checkbox" id="qaShowA" checked> 답변 펼치기</label>
  </div>
  <div id="qaList" class="qa-list"></div>
</section>

<!-- 4. 질의 연습 -->
<section id="v-practice" class="view">
  <div id="prSearchView" class="view on" style="padding:0">
    <div class="card search-hero">
      <label for="prQ">키워드, RFP 요구사항 번호, 발표자료 페이지로 질의를 찾아 연습하세요</label>
      <div class="search-row"><input id="prQ" type="search" placeholder="예: 데이터 품질 · SFR-012 · p.14" autocomplete="off"><button id="prClear" type="button">지우기</button></div>
      <div class="chips" id="prCats"></div>
    </div>
    <div class="pr-bar">
      <span id="prCount"></span>
      <select id="prMark" aria-label="내 연습 기록"><option value="">내 기록 전체</option><option value="none">아직 안 해본 질의</option><option value="again">다시 연습 표시</option><option value="ok">잘 답한 질의</option></select>
      <select id="prOrder" aria-label="순서"><option value="list">목록 순서</option><option value="random">무작위 순서</option></select>
      <select id="prLimit" aria-label="답변 목표 시간"><option value="30">답변 30초</option><option value="60" selected>답변 1분</option><option value="90">답변 1분 30초</option><option value="120">답변 2분</option></select>
      <button id="prStart" class="primary" type="button">이 질의들로 연습 시작</button>
    </div>
    <div id="prResults" class="qa-list"></div>
  </div>
  <div id="prDrill" class="hidden">
    <div class="card drill">
      <div class="drill-top"><span id="drPos">1 / 1</span><span id="drMeta" class="row"></span><button id="drExit" type="button">연습 끝내기 (Esc)</button></div>
      <div class="drill-q" id="drQ"></div>
      <div class="drill-timer"><b id="drTime">00:00</b><div class="bar"><span id="drBar"></span></div><small id="drLimitTxt"></small></div>
      <div class="drill-a hidden" id="drA"></div>
      <div class="drill-ctrl">
        <button id="drPrev" type="button">이전 (←)</button>
        <button id="drReveal" class="primary" type="button">답변 보기 (Space)</button>
        <button id="drOk" class="okb" type="button">잘 답함 (1)</button>
        <button id="drAgain" class="againb" type="button">다시 연습 (2)</button>
        <button id="drNext" type="button">다음 (→)</button>
      </div>
    </div>
  </div>
</section>

<!-- 사업 자료 관리 -->
<section id="v-setup" class="view">
  <div id="setupBody" class="view on" style="padding:0"></div>
</section>
</main>

<div id="toast" aria-live="polite"></div>
<div id="overlay" class="hidden" role="dialog" aria-modal="true"><div class="box"><h3 id="ovTitle"></h3><p id="ovMsg" style="color:var(--muted);font-size:14px"></p><div class="row"><button id="ovNo" type="button">취소</button><button id="ovYes" class="primary" type="button">확인</button></div></div></div>

<script src="app.js"></script>
</body>
</html>
